services:
  caddy:
    image: caddy:2-alpine
    container_name: budgie-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  backend:
    # Image construite et poussée par la CI (job « docker ») : le serveur ne
    # rebuild jamais, il tire la même image que celle testée dans le pipeline.
    image: ghcr.io/verceel/esgi-pa-backend:latest
    container_name: budgie-backend
    environment:
      APP_NAME: Budgie
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: Budgie
      STRIPE_SECRET: ${STRIPE_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - backend_database:/var/www/html/database
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: budgie-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  frontend:
    image: ghcr.io/verceel/esgi-pa-frontend:latest
    container_name: budgie-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_database:
  backend_storage:
  caddy_data:
  caddy_config:

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgie-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Budgie
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: sqlite
      # La base vit dans database/data (volume dédié). Ne pas monter database/ entier :
      # le volume masquerait migrations/ et les nouvelles migrations ne tourneraient jamais.
      DB_DATABASE: /var/www/html/database/data/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      # Envoi des emails vers Mailpit. Depuis un conteneur, "127.0.0.1" pointerait vers
      # le conteneur lui-même : on vise donc le service par son nom, "mailpit".
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # OAuth et Stripe : les identifiants viennent du .env à la racine (lu
      # automatiquement par docker compose pour interpoler les ${...}).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:5173/api/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: http://localhost:5173/api/auth/github/callback
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - backend_database:/var/www/html/database/data
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: budgie-mailpit
    ports:
      - "1025:1025"
      - "8025:8025" 
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budgie-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_database:
  backend_storage:

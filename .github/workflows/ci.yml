name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend # toutes les commandes de ce job s'exécutent dans backend/
    steps:
      # Récupère le code du dépôt sur la machine du runner.
      - uses: actions/checkout@v4

      # Installe PHP 8.3 avec les extensions dont Laravel et la suite de tests ont besoin.
      # pdo_sqlite : les tests tournent sur une base SQLite en mémoire (voir phpunit.xml).
      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, zip, gd
          coverage: none

      # Remet en cache le dossier vendor/ entre deux runs : tant que composer.lock ne
      # change pas, on ne retélécharge pas les dépendances.
      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      # Laravel a besoin d'un fichier .env et d'une APP_KEY (le chiffrement du secret 2FA
      # s'appuie dessus). On part du modèle et on génère une clé jetable pour le CI.
      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      # Lance la suite. phpunit.xml force APP_ENV=testing et une base SQLite :memory:,
      # donc aucune base externe n'est nécessaire ici.
      - name: Lancer les tests
        run: php artisan test

  # ------------------------------------------------------------------------------------
  # 2) FRONTEND — typecheck + build de production
  # ------------------------------------------------------------------------------------
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 20 + cache npm natif, indexé sur le package-lock.json du frontend.
      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installe exactement ce que fige le lockfile (reproductible, contrairement
      # à npm install qui peut faire bouger les versions).
      - name: Installer les dépendances
        run: npm ci

      # "npm run build" = "tsc -b && vite build" : d'abord le typecheck TypeScript
      # (échoue au moindre type incorrect), puis le bundle de production.
      - name: Compiler le frontend
        run: npm run build

  # ------------------------------------------------------------------------------------
  # 3) DOCKER — construire et publier les images (partie CD)
  # ------------------------------------------------------------------------------------
  docker:
    name: Build & push des images
    needs: [backend, frontend] # ne démarre que si les deux jobs ci-dessus ont réussi
    # On ne publie que sur un vrai push vers main. Sur une pull request, ce job est ignoré :
    # on teste, mais on ne livre pas tant que ce n'est pas fusionné.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nécessaire pour pousser une image sur GHCR
    steps:
      - uses: actions/checkout@v4

      # GHCR exige un nom d'image en minuscules ; on dérive "owner/repo" en minuscules.
      - name: Nom du dépôt en minuscules
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Connexion au registre GitHub. GITHUB_TOKEN est fourni automatiquement par
      # GitHub Actions : aucun secret à créer à la main.
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construit backend/Dockerfile et pousse deux tags : "latest" (le dernier état de main)
      # et le SHA du commit (une version précise, utile pour revenir en arrière).
      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-backend:latest
            ghcr.io/${{ env.REPO }}-backend:${{ github.sha }}

      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-frontend:latest
            ghcr.io/${{ env.REPO }}-frontend:${{ github.sha }}

  # ------------------------------------------------------------------------------------
  # 4) DÉPLOIEMENT (à activer quand tu auras un serveur)
  # ------------------------------------------------------------------------------------
  # Le déploiement dépend de TA cible (VPS, plateforme cloud…), que je ne connais pas
  # encore. Le schéma le plus courant, une fois les images publiées ci-dessus : se
  # connecter en SSH au serveur et tirer les nouvelles images. Exemple à décommenter et
  # compléter — il faut d'abord créer les secrets SSH_HOST, SSH_USER et SSH_KEY dans
  # Settings → Secrets and variables → Actions du dépôt.
